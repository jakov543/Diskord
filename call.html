<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diskord Call</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<script src="diskord-config.js"></script>
<script src="sounds.js"></script>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root { --bg0:#05070d; --bg1:#0c111d; --bg2:#121a2b; --bg3:#1b2540; --bg4:#24304f; --line:rgba(255,255,255,.08); --text:#eef3fc; --muted:#9caccc; --a1:#38bdf8; --a2:#6366f1; --accent:#3b82f6; --grad:linear-gradient(135deg,var(--a1),var(--a2)); --ok:#2bd98a; --bad:#f23f43; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #000; color: var(--text); overflow: hidden; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
.hidden { display: none !important; }
svg { fill: currentColor; }
header { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 5; background: linear-gradient(#000c, #0000); }
header img { width: 24px; height: 24px; }
header b { font-weight: 800; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .live { margin-left: auto; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
header .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(43,217,138,.18); }

/* lobby */
.lobby { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 50% 0%, rgba(59,130,246,.18), transparent 60%), #000; }
.card { width: min(420px, 100%); background: var(--bg1); border: 1px solid var(--line); border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.card .logo { width: 64px; height: 64px; margin: 0 auto 12px; }
.card h1 { font-size: 22px; font-weight: 800; }
.card p { color: var(--muted); font-size: 14px; margin: 6px 0 18px; line-height: 1.5; }
.card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 0; background: var(--bg0); outline: none; margin-bottom: 12px; font-size: 15px; }
.meter { height: 6px; border-radius: 3px; background: var(--bg4); overflow: hidden; margin: 4px 0 16px; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .08s; }
.big { width: 100%; padding: 13px; border-radius: 10px; background: var(--grad); color: #fff; font-weight: 800; font-size: 15px; }
.big:disabled { opacity: .5; }
.small { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.5; }

/* stage */
.stage { position: fixed; top: 52px; left: 0; right: 0; bottom: 96px; padding: 8px 20px; display: grid; gap: 12px; align-content: center; justify-content: center; }
.tile { position: relative; background: var(--bg2); border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; display: grid; place-items: center; outline: 3px solid transparent; outline-offset: -3px; transition: outline-color .12s; cursor: pointer; }
.tile.speaking { outline-color: var(--ok); }
.tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.tile video.mirror { transform: scaleX(-1); }
.tile video.contain { object-fit: contain; }
.tile .face { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: #fff; z-index: 1; overflow: hidden; background-size: cover; background-position: center; transition: box-shadow .12s; }
.tile .tag { position: absolute; left: 8px; bottom: 8px; z-index: 2; background: rgba(0,0,0,.6); padding: 4px 9px; border-radius: 6px; font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; }
.tile .badges { position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; gap: 4px; }
.badge { width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.7); display: grid; place-items: center; }
.badge svg { width: 14px; height: 14px; fill: var(--bad); }
.tile .live-tag { position: absolute; left: 8px; top: 8px; z-index: 2; background: var(--bad); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
.tile.camoff video { visibility: hidden; }
.tile:not(.camoff) .face { display: none; }
/* voice only: Discord-style circles */
.stage.voice { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 22px; }
.stage.voice .tile { width: 112px; height: 112px; aspect-ratio: auto; background: none; overflow: visible; outline: 0; cursor: default; }
.stage.voice .tile .face { width: 104px; height: 104px; font-size: 42px; }
.stage.voice .tile.speaking .face { box-shadow: 0 0 0 4px #000, 0 0 0 7px var(--ok); }
.stage.voice .tile .tag { display: none; }
.stage.voice .tile .badges { right: -2px; bottom: -2px; }
.stage.voice .tile .badge { width: 30px; height: 30px; background: #000; } .stage.voice .badge svg { width: 17px; height: 17px; }
.stage.voice .tile:hover .tag { display: flex; left: 50%; bottom: -30px; transform: translateX(-50%); }
.waiting { position: fixed; left: 0; right: 0; top: calc(50% + 70px); text-align: center; color: var(--muted); font-size: 14px; }
/* focus one tile */
.stage.focus { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.stage.focus .tile { display: none; }
.stage.focus .tile.big { display: grid; flex: 1; width: 100%; max-height: calc(100% - 110px); aspect-ratio: auto; }
.strip { display: flex; gap: 10px; justify-content: center; } .strip .tile { display: grid !important; width: 170px; flex: 0 0 auto; }

/* control bar */
.bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 6; }
.grp { display: flex; align-items: center; background: var(--bg1); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.cb { height: 46px; min-width: 46px; border-radius: 9px; display: grid; place-items: center; color: #dde4f3; position: relative; transition: background .12s; }
.cb:hover { background: var(--bg3); }
.cb svg { width: 23px; height: 23px; }
.cb.caret { min-width: 26px; width: 26px; margin-left: -4px; } .cb.caret svg { width: 16px; height: 16px; }
.cb.offred { color: var(--bad); }
.cb.onlive { color: var(--ok); }
.cb.leave { background: var(--bad); color: #fff; width: 72px; border-radius: 12px; height: 54px; }
.cb.leave:hover { background: #d8343a; }
.cb[data-tip]:hover::after { content: attr(data-tip); position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid var(--line); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; font-weight: 700; white-space: nowrap; pointer-events: none; }
.pop { position: fixed; z-index: 30; background: var(--bg1); border: 1px solid var(--line); border-radius: 10px; padding: 6px; min-width: 240px; box-shadow: 0 16px 40px rgba(0,0,0,.6); max-height: 70vh; overflow-y: auto; }
.pop h4 { font-size: 11.5px; font-weight: 800; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.pop .it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 14px; font-weight: 600; }
.pop .it:hover { background: var(--accent); color: #fff; }
.pop .it .rd { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); flex: 0 0 16px; }
.pop .it.sel .rd { border-color: #fff; box-shadow: inset 0 0 0 3px var(--bg1); background: #fff; }
.pop .it:hover .rd { border-color: #fff; }
.pop .it span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .it.danger { color: var(--bad); } .pop .it.danger:hover { background: var(--bad); color: #fff; }
.pop .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.emojis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
.emojis button { font-size: 28px; padding: 6px; border-radius: 8px; } .emojis button:hover { background: var(--bg3); transform: scale(1.1); }
.sounds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 4px; width: 300px; }
.sounds button { display: flex; gap: 8px; align-items: center; padding: 10px; border-radius: 8px; background: var(--bg2); font-weight: 700; font-size: 13.5px; text-align: left; } .sounds button:hover { background: var(--bg3); }
.sounds button b { font-size: 20px; }
.float { position: fixed; bottom: 110px; font-size: 44px; z-index: 20; pointer-events: none; animation: up 2.6s ease-out forwards; }
.float small { display: block; font-size: 12px; font-weight: 700; text-align: center; background: rgba(0,0,0,.6); border-radius: 6px; padding: 1px 6px; }
@keyframes up { 0% { transform: translateY(0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translateY(-30px) scale(1.1); } 100% { transform: translateY(-50vh) scale(1); opacity: 0; } }

/* screen share picker (Discord style) */
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 40; display: grid; place-items: center; padding: 20px; }
.sp { width: min(1080px, 100%); height: min(860px, 100%); background: var(--bg1); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.sp-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 18px 22px 0; background: var(--bg0); padding: 5px; border-radius: 10px; }
.sp-tabs button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; border-radius: 7px; font-weight: 700; font-size: 15px; color: var(--muted); }
.sp-tabs button svg { width: 18px; height: 18px; } .sp-tabs button.on { background: var(--bg3); color: #fff; } .sp-tabs button:hover:not(.on) { color: #fff; }
.sp-grid { flex: 1; overflow-y: auto; padding: 18px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; align-content: start; }
.src { text-align: left; border-radius: 10px; }
.src .th { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; border: 2px solid transparent; transition: border-color .12s; }
.src .th img, .src .th video { width: 100%; height: 100%; object-fit: contain; display: block; }
.src .th .go { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fff; color: #000; padding: 10px 22px; border-radius: 8px; font-weight: 700; font-size: 15px; opacity: 0; transition: opacity .12s; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.src:hover .th { border-color: rgba(255,255,255,.35); } .src:hover .th .go { opacity: 1; }
.src .nm { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .nm img { width: 18px; height: 18px; flex: 0 0 18px; } .src .nm .gi { width: 18px; height: 18px; flex: 0 0 18px; opacity: .8; }
.sp-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.6; }
.sp-f { display: flex; align-items: center; gap: 12px; padding: 16px 22px; border-top: 1px solid var(--line); }
.sp-q b { display: block; font-size: 16px; } .sp-q small { color: var(--muted); font-size: 13.5px; }
.sp-f .sp-audio { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; cursor: pointer; margin-left: auto; }
.sp-gear { width: 48px; height: 48px; border-radius: 10px; background: var(--bg3); display: grid; place-items: center; } .sp-gear:hover { background: var(--bg4); } .sp-gear svg { width: 24px; height: 24px; }
.sp-x { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 18px; } .sp-x:hover { color: #fff; background: var(--bg3); }
.qs { position: fixed; z-index: 50; width: 320px; background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
.qs h4 { font-size: 12px; text-transform: uppercase; font-weight: 800; color: var(--muted); margin: 6px 0 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--bg0); padding: 4px; border-radius: 8px; margin-bottom: 8px; }
.seg button { padding: 8px 4px; border-radius: 6px; font-weight: 700; font-size: 13px; color: var(--muted); } .seg button.on { background: var(--accent); color: #fff; }
.qs p { color: var(--muted); font-size: 12px; line-height: 1.45; }
.toast { position: fixed; top: 62px; left: 50%; transform: translateX(-50%); background: var(--bg1); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; }
.toast.show { opacity: 1; }
.ended { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 70; }
</style>
</head>
<body>
<header><img id="hIcon" src="logo.svg" alt=""><b id="roomLabel">Diskord call</b><span class="live hidden" id="live"><i></i><span id="count"></span> · <span id="timer">00:00</span></span></header>

<div class="lobby" id="lobby"><div class="card">
  <img class="logo" src="logo.svg" alt="">
  <h1 id="lobbyTitle">Join the call</h1>
  <p id="lobbyText">Check your mic, then join.</p>
  <input id="name" maxlength="32" placeholder="Your name">
  <div class="meter"><i id="meter"></i></div>
  <button class="big" id="join">Join call</button>
  <div class="small" id="lobbyNote">Voice and video go straight between the people in the call.</div>
</div></div>

<div class="stage hidden voice" id="stage"></div>
<div class="waiting hidden" id="waiting">Waiting for others to join…</div>
<div class="bar hidden" id="bar">
  <div class="grp">
    <button class="cb" id="bMic" data-tip="Mute"></button><button class="cb caret" id="mMic" data-tip="Audio settings"></button>
    <button class="cb" id="bCam" data-tip="Turn On Camera"></button><button class="cb caret" id="mCam" data-tip="Camera settings"></button>
  </div>
  <div class="grp">
    <button class="cb" id="bScreen" data-tip="Share Your Screen"></button>
    <button class="cb" id="bReact" data-tip="Reactions"></button>
    <button class="cb" id="bSound" data-tip="Soundboard"></button>
    <button class="cb" id="bMore" data-tip="More"></button>
  </div>
  <button class="cb leave" id="bLeave" data-tip="Disconnect"></button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tT; const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(tT); tT = setTimeout(() => $('toast').classList.remove('show'), 2600); };
const sfx = n => { try { window.DiskordSounds && window.DiskordSounds.play(n); } catch (_) {} };
const store = { get: (k, d) => { try { return localStorage.getItem('flixcall.' + k) ?? d; } catch (_) { return d; } }, set: (k, v) => { try { localStorage.setItem('flixcall.' + k, v); } catch (_) {} } };
const I = {
  mic: '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>',
  micOff: '<svg viewBox="0 0 24 24"><path d="M15 10.6V5a3 3 0 0 0-5.9-.8zM19 11h-2c0 .8-.2 1.6-.5 2.3l1.5 1.5A7 7 0 0 0 19 11zM4.3 3 3 4.3l6 6V11a3 3 0 0 0 4.4 2.7l1.5 1.5A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 3.3-1.3l3.4 3.4 1.3-1.3z"/></svg>',
  cam: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg>',
  camOff: '<svg viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.8L21 17.2zM3.3 2 2 3.3 4.7 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 .5-.2l3.2 3.2 1.3-1.3z"/></svg>',
  caret: '<svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>',
  screen: '<svg viewBox="0 0 24 24"><path d="M20 3H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h6v2H8v2h8v-2h-2v-2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H4V5h16zm-8-9-4 4h3v3h2v-3h3z"/></svg>',
  react: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-3.5 6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 18a5.5 5.5 0 0 1-5-3.2h10A5.5 5.5 0 0 1 12 18z"/></svg>',
  sound: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>',
  leave: '<svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.1.3-4.6.7v3.1a1 1 0 0 1-.6.9 11 11 0 0 0-2.6 1.8 1 1 0 0 1-1.4 0L.3 13a1 1 0 0 1 0-1.4C3.3 8.7 7.4 7 12 7s8.7 1.7 11.7 4.6a1 1 0 0 1 0 1.4l-2.5 2.5a1 1 0 0 1-1.4 0 11 11 0 0 0-2.6-1.8 1 1 0 0 1-.6-.9V9.7C15.1 9.3 13.6 9 12 9z"/></svg>',
  deaf: '<svg viewBox="0 0 24 24"><path d="M3.3 2 2 3.3l3.6 3.6A9 9 0 0 0 3 12v7a2 2 0 0 0 2 2h3v-8H5v-1c0-1.3.4-2.5 1-3.6L19 21.7l1.3-1.3zM12 3c-1.5 0-3 .4-4.2 1.1l1.5 1.5A7 7 0 0 1 19 12v1h-1.7l3.6 3.6c.1-.2.1-.4.1-.6v-4a9 9 0 0 0-9-9z"/></svg>',
  app: '<svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H5V8h14z"/></svg>',
  monitor: '<svg viewBox="0 0 24 24"><path d="M20 3H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h6v2H8v2h8v-2h-2v-2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 13H4V5h16z"/></svg>',
  gear: '<svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>'
};
for (const [id, ic] of [['mMic', 'caret'], ['mCam', 'caret'], ['bScreen', 'screen'], ['bReact', 'react'], ['bSound', 'sound'], ['bMore', 'more'], ['bLeave', 'leave']]) $(id).innerHTML = I[ic];

// #r=<room>&n=<name>&t=<title>&a=<avatar url>
const params = new URLSearchParams(location.hash.slice(1));
const ROOM = (params.get('r') || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 80);
const TITLE = (params.get('t') || '').slice(0, 60);
const okAv = v => typeof v === 'string' && /^https:\/\/[^\s"'()<>]+$/.test(v) && v.length < 300 ? v : '';
const MY_AV = okAv(params.get('a') || '');
const WANT_SCREEN = params.get('s') === '1', WANT_VIDEO = params.get('v') === '1', START_MUTED = params.get('m') === '1', START_DEAF = params.get('d') === '1';
const DESK = !!(window.diskord && window.diskord.screenSources);
$('name').value = params.get('n') || store.get('name', '');
$('roomLabel').textContent = TITLE || 'Diskord call';
document.title = (TITLE || 'Call') + ' · Diskord';
if (WANT_VIDEO) { $('lobbyTitle').textContent = '🎥 Join the video call'; $('join').textContent = 'Join with video'; }
if (!ROOM) {
  $('lobbyTitle').textContent = 'No call here';
  $('lobbyText').textContent = 'Open a call from Diskord (the 📞 or 🎥 button in a chat, on someone\'s profile, or a voice channel).';
  ['name', 'join'].forEach(id => $(id).classList.add('hidden')); document.querySelector('.meter').classList.add('hidden');
  return;
}
if (typeof Peer === 'undefined') { $('lobbyText').textContent = 'Could not load the call engine. Check your internet connection and reload.'; $('join').disabled = true; return; }

const COLORS = ['#ff3d6e', '#8b5cf6', '#22c1ee', '#2bd98a', '#ffb020', '#ff7a45', '#4f7cff', '#e94cd8'];

// soundboard: little sounds made right here (no files), everyone in the call hears them
const SOUNDS = [['horn', '📯', 'Airhorn'], ['drum', '🥁', 'Ba Dum Tss'], ['ding', '🔔', 'Ding'], ['clap', '👏', 'Applause'], ['boom', '💥', 'Boom'], ['siren', '🚨', 'Siren'], ['sad', '🎺', 'Sad Trombone'], ['cricket', '🦗', 'Crickets']];
function playSound(k) {
  const a = audioCtx(); if (a.state === 'suspended') a.resume();
  const t0 = a.currentTime, out = sfxBus;
  const tone = (f, s, d, type = 'sine', v = .3, f2) => { const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0 + s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + s + d); g.gain.setValueAtTime(0, t0 + s); g.gain.linearRampToValueAtTime(v, t0 + s + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + s + d); o.connect(g); g.connect(out); o.start(t0 + s); o.stop(t0 + s + d + .05); };
  const noiseHit = (s, d, v = .4, hp = 1000) => { const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; n.buffer = b; const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; const g = a.createGain(); g.gain.setValueAtTime(v, t0 + s); g.gain.exponentialRampToValueAtTime(.001, t0 + s + d); n.connect(f); f.connect(g); g.connect(out); n.start(t0 + s); };
  if (k === 'horn') for (let i = 0; i < 3; i++) { [415, 523, 622].forEach(f => tone(f, i * .28, .24, 'sawtooth', .12)); }
  if (k === 'drum') { tone(160, 0, .25, 'sine', .6, 50); tone(140, .22, .25, 'sine', .6, 45); noiseHit(.5, .9, .35, 5000); }
  if (k === 'ding') { tone(1320, 0, 1.2, 'sine', .35); tone(2640, 0, .6, 'sine', .08); }
  if (k === 'clap') for (let i = 0; i < 26; i++) noiseHit(i * .06 + Math.random() * .05, .12, .25, 1500);
  if (k === 'boom') { tone(120, 0, 1.2, 'sine', .8, 30); noiseHit(0, 1, .5, 60); }
  if (k === 'siren') tone(650, 0, 1.6, 'square', .1, 1300);
  if (k === 'sad') [[392, 0], [370, .35], [349, .7], [330, 1.05]].forEach(([f, s], i) => tone(f, s, i === 3 ? 1 : .32, 'sawtooth', .13, i === 3 ? 300 : 0));
  if (k === 'cricket') for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) tone(4200, i * .3 + j * .03, .02, 'sine', .15);
}
$('bSound').onclick = () => popAt($('bSound'), `<h4>Soundboard</h4><div class="sounds">${SOUNDS.map(([k, e, n]) => `<button data-s="${k}"><b>${e}</b>${n}</button>`).join('')}</div>`, p => {
  p.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { if (me.deaf) return toast('Undeafen to use the soundboard'); playSound(b.dataset.s); sendFx('sfx', b.dataset.s); });
});
$('bMore').onclick = () => popAt($('bMore'), `
  <button class="it" data-m="deaf"><span>${me.deaf ? 'Undeafen' : 'Deafen'}</span></button>
  <button class="it" data-m="link"><span>Copy Invite Link</span></button>
  <button class="it" data-m="full"><span>${document.fullscreenElement ? 'Exit Full Screen' : 'Full Screen'}</span></button>
  <button class="it" data-m="q"><span>Stream Quality: ${qLabel()}</span></button>
  <div class="sep"></div><button class="it danger" data-m="leave"><span>Disconnect</span></button>`, p => {
  p.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
    const k = b.dataset.m; closePops();
    if (k === 'deaf') toggleDeaf();
    if (k === 'link') { const u = location.href.split('#')[0] + '#r=' + ROOM + (TITLE ? '&t=' + encodeURIComponent(TITLE) : ''); try { await navigator.clipboard.writeText(u); toast('Invite link copied'); } catch (_) { prompt('Copy this link', u); } }
    if (k === 'full') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
    if (k === 'q') qualityPanel($('bMore'));
    if (k === 'leave') $('bLeave').click();
  });
});

// ------------------------------------------------------------ screen share picker
function qualityPanel(anchor, onChange) {
  closePops();
  const p = document.createElement('div'); p.className = 'qs'; document.body.appendChild(p);
  const draw = () => {
    p.innerHTML = `<h4>Optimise for</h4><div class="seg">${[['gaming', 'Gaming'], ['text', 'Text'], ['custom', 'Custom']].map(([k, n]) => `<button data-p="${k}" class="${Q.preset === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <h4>Resolution</h4><div class="seg">${[[720, '720p'], [1080, '1080p'], [1440, '1440p'], [0, 'Source']].map(([k, n]) => `<button data-r="${k}" class="${Q.res === k ? 'on' : ''}">${n}</button>`).join('')}</div>
      <h4>Frame rate</h4><div class="seg">${[15, 30, 60].map(k => `<button data-f="${k}" class="${Q.fps === k ? 'on' : ''}">${k} FPS</button>`).join('')}</div>
      <p>${Q.preset === 'gaming' ? 'Smoother video for games and videos.' : Q.preset === 'text' ? 'Sharper text for code, docs and websites.' : 'Your own resolution and frame rate.'} Free for everyone — high settings need a good upload speed.</p>`;
    const save = () => { store.set('quality', JSON.stringify(Q)); draw(); onChange && onChange(); if (screenTrack) { const [w, h] = RES[Q.res] || RES[1080]; screenTrack.applyConstraints({ width: { max: w }, height: { max: h }, frameRate: { ideal: Q.fps, max: Q.fps } }).catch(() => {}); try { screenTrack.contentHint = Q.preset === 'text' ? 'detail' : 'motion'; } catch (_) {} tuneSenders(); } };
    p.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { Q.preset = b.dataset.p; if (Q.preset === 'gaming') { Q.fps = 60; if (Q.res < 1080 && Q.res) Q.res = 1080; } if (Q.preset === 'text') { Q.fps = 15; Q.res = 0; } save(); });
    p.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { Q.res = +b.dataset.r; Q.preset = 'custom'; save(); });
    p.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { Q.fps = +b.dataset.f; Q.preset = 'custom'; save(); });
  };
  draw();
  const r = anchor.getBoundingClientRect(), pr = p.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(innerWidth - pr.width - 8, r.right - pr.width)) + 'px'; p.style.top = Math.max(8, r.top - pr.height - 10) + 'px';
  setTimeout(() => document.addEventListener('mousedown', function off(e) { if (!p.contains(e.target) && !anchor.contains(e.target)) { p.remove(); document.removeEventListener('mousedown', off); } }), 0);
}
async function openSharePicker() {
  closePops();
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="sp"><div class="sp-tabs"><button data-t="window">${I.app}Applications</button><button data-t="screen">${I.monitor}Entire Screen</button><button data-t="device">${I.cam}Devices</button></div>
    <div class="sp-grid" id="spGrid"><div class="sp-empty">Loading…</div></div>
    <div class="sp-f"><div class="sp-q"><b id="spQ"></b><small id="spQs"></small></div>
    ${DESK && /Windows/.test(navigator.userAgent) ? '<label class="sp-audio"><input type="checkbox" id="spAudio"> Also share PC sound</label>' : '<span style="margin-left:auto"></span>'}
    <button class="sp-gear" id="spGear" title="Stream quality">${I.gear}</button><button class="sp-x" id="spX" title="Close (Esc)">✕</button></div></div>`;
  document.body.appendChild(ov);
  let tab = 'window', list = [], cams = [], previews = [];
  const close = () => { previews.forEach(s => s.getTracks().forEach(t => t.stop())); previews = []; ov.remove(); document.removeEventListener('keydown', key); closePops(); };
  const key = e => { if (e.key === 'Escape') close(); }; document.addEventListener('keydown', key);
  ov.onmousedown = e => { if (e.target === ov) close(); };
  ov.querySelector('#spX').onclick = close;
  const drawQ = () => { ov.querySelector('#spQ').textContent = qLabel(); ov.querySelector('#spQs').textContent = qSub(); };
  ov.querySelector('#spGear').onclick = () => qualityPanel(ov.querySelector('#spGear'), drawQ); drawQ();
  const audio = () => { const a = ov.querySelector('#spAudio'); return !!(a && a.checked); };
  const card = (attr, id, thumb, icon, name) => `<button class="src" ${attr}="${esc(id)}"><div class="th">${thumb}<span class="go">Share Screen</span></div><div class="nm">${icon}<span style="overflow:hidden;text-overflow:ellipsis">${esc(name)}</span></div></button>`;
  const draw = async () => {
    previews.forEach(s => s.getTracks().forEach(t => t.stop())); previews = [];
    ov.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    const g = ov.querySelector('#spGrid');
    if (tab === 'device') {
      cams = await devices('videoinput');
      g.innerHTML = cams.length ? cams.map((d, i) => card('data-dev', d.deviceId, `<video muted playsinline autoplay data-pv="${esc(d.deviceId)}"></video>`, `<span class="gi">${I.cam}</span>`, d.label || 'Camera ' + (i + 1))).join('') : '<div class="sp-empty">No cameras or capture cards found.</div>';
      for (const v of g.querySelectorAll('[data-pv]')) navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: v.dataset.pv }, width: 640, height: 360 } }).then(s => { if (!ov.isConnected) return s.getTracks().forEach(t => t.stop()); previews.push(s); v.srcObject = s; }).catch(() => {});
      g.querySelectorAll('[data-dev]').forEach(b => b.onclick = async () => {
        const id = b.dataset.dev; close();
        try { const [w, h] = RES[Q.res] || RES[1080]; const s = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: id }, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: Q.fps } } }); await useScreenStream(s); }
        catch (_) { toast('Could not open that device'); }
      });
      return;
    }
    if (!DESK) {
      g.innerHTML = `<div class="sp-empty">Your browser shows its own list of ${tab === 'window' ? 'windows' : 'screens'}.<br><br><button class="big" style="width:auto;padding:12px 26px" id="spBrowser">Choose what to share</button></div>`;
      g.querySelector('#spBrowser').onclick = async () => { close(); try { const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: Q.fps }, audio: true }); await useScreenStream(s); } catch (_) {} };
      return;
    }
    const items = list.filter(s => s.type === tab);
    g.innerHTML = items.length ? items.map(s => card('data-id', s.id, `<img src="${s.thumb}" alt="">`, s.icon ? `<img src="${s.icon}" alt="">` : `<span class="gi">${tab === 'screen' ? I.monitor : I.app}</span>`, s.name)).join('') : `<div class="sp-empty">${tab === 'window' ? 'No open app windows found.' : 'No screens found.'}</div>`;
    g.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
      const id = b.dataset.id, au = audio(); close();
      try {
        const ok = await window.diskord.shareSource(id, au); if (!ok) return toast('That window closed — try again');
        const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: Q.fps }, audio: au });
        await useScreenStream(s);
      } catch (_) { toast('Screen share was cancelled'); }
    });
  };
  ov.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
  if (DESK) { try { list = await window.diskord.screenSources(); } catch (_) { list = []; } if (!list.some(x => x.type === 'window')) tab = 'screen'; }
  if (ov.isConnected) draw();
}

let left = false;
$('bLeave').onclick = () => {
  left = true; tellOpener('left'); sfx('leave');
  for (const id of [...calls.keys()]) dropPeer(id);
  [peer, dirPeer].forEach(p => p && p.destroy());
  [mic, screenAudio].forEach(x => x && x.getTracks().forEach(t => t.stop())); [camTrack, screenTrack].forEach(t => t && t.stop());
  document.body.insertAdjacentHTML('beforeend', `<div class="ended"><div class="card"><img class="logo" src="logo.svg" alt=""><h1>You left the call</h1><p>You can close this window and go back to Diskord.</p><button class="big" onclick="location.reload()">Rejoin</button></div></div>`);
  if (window.opener && DESK) setTimeout(() => window.close(), 900);
};
