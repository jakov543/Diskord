<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self'">
<link rel="stylesheet" href="common.css"><style>
body { background: transparent; display: grid; place-items: center; }
.card { width: 320px; height: 380px; border-radius: 26px; background: radial-gradient(ellipse at 50% 0%, rgba(166,77,255,.35), transparent 65%), var(--bg1); border: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 30px 60px rgba(0,0,0,.5); -webkit-app-region: drag; }
.logo { width: 110px; animation: float 2.4s ease-in-out infinite; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; } h1 span { background: var(--grad); -webkit-background-clip: text; color: transparent; }
#status { color: var(--muted); font-size: 13px; min-height: 18px; }
.bar { width: 160px; height: 4px; border-radius: 2px; background: var(--bg4); overflow: hidden; }
.bar i { display: block; height: 100%; width: 40%; background: var(--grad); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
small { position: absolute; bottom: 44px; color: #6f6889; font-size: 11px; }
</style></head><body><div class="card"><img class="logo" src="logo.svg" alt=""><h1>Dis<span>kord</span></h1><div class="bar"><i></i></div><div id="status">Starting…</div></div><small id="ver"></small>
<script>window.diskord && window.diskord.onStatus(t => document.getElementById('status').textContent = t); document.getElementById('ver').textContent = window.diskord ? 'v' + window.diskord.version : '';</script></body></html>
