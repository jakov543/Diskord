<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Share your screen</title><link rel="stylesheet" href="common.css"><style>
body { background: #0f1729; overflow: hidden; }
.wrap { height: 100vh; display: flex; flex-direction: column; }
header { padding: 18px 22px 0; } h1 { font-size: 20px; font-weight: 800; } header p { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.tabs { display: flex; gap: 6px; margin: 14px 22px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.tabs button { padding: 9px 14px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: #fff; border-color: #3b82f6; }
.grid { flex: 1; overflow-y: auto; padding: 16px 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: start; }
.src { border-radius: 10px; padding: 6px; background: #16213a; border: 2px solid transparent; cursor: pointer; text-align: left; }
.src:hover { background: #1c2a4a; } .src.sel { border-color: #3b82f6; background: #1c2a4a; }
.src img.t { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; display: block; }
.src .n { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src .n img { width: 16px; height: 16px; }
footer { display: flex; align-items: center; gap: 10px; padding: 14px 22px; background: #0b1222; }
footer label { flex: 1; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13.5px; cursor: pointer; }
.btn.main { background: linear-gradient(135deg,#38bdf8,#4f46e5); }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px; }
</style></head><body><div class="wrap">
<header><h1>Share your screen</h1><p>Pick a whole screen or just one app window.</p></header>
<div class="tabs"><button data-t="window" class="on">Applications</button><button data-t="screen">Entire screen</button></div>
<div class="grid" id="grid"><div class="empty">Loading…</div></div>
<footer><label><input type="checkbox" id="audio"> Also share sound</label><button class="btn alt" id="cancel">Cancel</button><button class="btn main" id="go" disabled>Go Live</button></footer>
</div><script>
let list = [], tab = 'window', sel = null;
const grid = document.getElementById('grid'), go = document.getElementById('go');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function draw() {
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const items = list.filter(s => s.type === tab);
  grid.innerHTML = items.length ? items.map(s => `<button class="src ${s.id === sel ? 'sel' : ''}" data-id="${esc(s.id)}"><img class="t" src="${s.thumb}" alt=""><div class="n">${s.icon ? `<img src="${s.icon}" alt="">` : ''}${esc(s.name)}</div></button>`).join('') : `<div class="empty">${tab === 'window' ? 'No open app windows found.' : 'No screens found.'}</div>`;
  grid.querySelectorAll('[data-id]').forEach(b => { b.onclick = () => { sel = b.dataset.id; go.disabled = false; draw(); }; b.ondblclick = () => { sel = b.dataset.id; choose(); }; });
}
function choose() { if (sel) window.diskord.pickerChoose(sel, document.getElementById('audio').checked); }
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
document.getElementById('cancel').onclick = () => window.diskord.pickerChoose(null, false);
go.onclick = choose;
addEventListener('keydown', e => { if (e.key === 'Escape') window.diskord.pickerChoose(null, false); if (e.key === 'Enter') choose(); });
window.diskord.onSources(s => { list = s; if (!list.some(x => x.type === 'window')) tab = 'screen'; draw(); });
</script></body></html>
