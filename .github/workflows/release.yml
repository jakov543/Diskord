name: Build Diskord installer
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle the Diskord app into the desktop app
        shell: bash
        run: |
          mkdir -p desktop/app/icons desktop/app/vendor
          cp index.html call.html adapter.js sounds.js diskord-config.js logo.svg manifest.webmanifest desktop/app/
          cp vendor/nostr.bundle.js desktop/app/vendor/
          cp icons/*.png desktop/app/icons/
          cp CHANGELOG.md desktop/CHANGELOG.md
          cd desktop/app/vendor
          npm pack peerjs@1.5.4 --silent
          tar -xzf peerjs-1.5.4.tgz && cp package/dist/peerjs.min.js . && rm -rf package *.tgz
          cd ..
          sed -i 's#https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js#vendor/peerjs.min.js#' call.html
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> $GITHUB_OUTPUT
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '/^## /{p=($2==v)} p && !/^## /' CHANGELOG.md > notes.md
          {
            echo "## What's new in Diskord $V"; echo; cat notes.md; echo
            echo "---"; echo "### ⬇️ Downloads"
            echo "- **Diskord-Setup-$V.exe**: the Diskord app for Windows 10 / 11. If SmartScreen appears, click **More info → Run anyway**."
            echo; echo "Already have Diskord? It updates itself."
          } > body.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Diskord ${{ steps.v.outputs.version }}
          make_latest: true
          body_path: body.md
          files: |
            desktop/dist/Diskord-Setup-*.exe
            desktop/dist/Diskord-Setup-*.exe.blockmap
            desktop/dist/latest.yml
