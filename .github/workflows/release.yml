name: Build Diskord installer
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run dist
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> $GITHUB_OUTPUT
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Diskord ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            ## Diskord for Windows 10 / 11
            1. Download **Diskord-Setup-${{ steps.v.outputs.version }}.exe** below.
            2. Run it. If Windows SmartScreen says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).
            3. Open Diskord from the desktop or Start menu, then **Log in** or **Sign up**.

            **New in this version:** startup screen, Log in / Sign up screen, offline screen that reconnects by itself, Log out (tray icon or View menu), remembers window size, F5 to reload.

            Calls open in their own Diskord window with mic, camera and screen share.
          files: desktop/dist/Diskord-Setup-*.exe
